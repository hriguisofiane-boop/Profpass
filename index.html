<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.minepi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://socialchain.app https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com;">
  <title>ProofPass - Web3 Digital Identity & Skill Verification</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --bg-dark: #090614;
      --card-bg: #130d26;
      --gold: #d4af37;
      --purple: #8b5cf6;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1338 0%, var(--bg-dark) 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.9rem;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--gold), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .status-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), var(--purple));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .identity-card {
      display: none;
      margin-top: 20px;
      text-align: left;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 14px;
      padding: 16px;
    }
    .identity-row {
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .identity-row span {
      color: var(--gold);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Luxveres Ecosystem</div>
    <h1>PROOFPASS</h1>
    <p class="subtitle">Your Identity. Your Proofs. Your Power.</p>

    <div class="status-box" id="pi-auth-status">
      Initializing Pi Network Authentication...
    </div>

    <button class="btn" id="signin-btn" type="button">
      Verify Identity with Pi
    </button>

    <div class="identity-card" id="identity-card">
      <div class="identity-row"><span>Pioneer Username:</span> <strong id="user-name">-</strong></div>
      <div class="identity-row"><span>Verified UID:</span> <strong id="user-uid">-</strong></div>
      <div class="identity-row"><span>Status:</span> <strong>Verified via App Studio</strong></div>
    </div>
  </div>

  <script>
    let appSession = {
      sessionToken: null,
      user: null
    };

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    async function authenticateWithPi() {
      const statusEl = document.getElementById("pi-auth-status");
      const cardEl = document.getElementById("identity-card");
      const nameEl = document.getElementById("user-name");
      const uidEl = document.getElementById("user-uid");

      try {
        statusEl.textContent = "Connecting to Pi SDK...";
        await window.Pi.init({ version: "2.0" });

        const authResult = await window.Pi.authenticate(["username"], onIncompletePaymentFound);
        const accessToken = authResult.accessToken;

        statusEl.textContent = "Verifying token with App Studio...";
        const response = await fetch("https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken: accessToken })
        });

        if (!response.ok) {
          throw new Error("App Studio verification failed: " + response.status);
        }

        const verifiedData = await response.json();
        appSession.sessionToken = verifiedData.sessionToken;
        appSession.user = {
          uid: verifiedData.user.uid,
          username: verifiedData.user.username
        };

        statusEl.textContent = "Identity Verified Successfully!";
        nameEl.textContent = "@" + appSession.user.username;
        uidEl.textContent = appSession.user.uid;
        cardEl.style.display = "block";
      } catch (err) {
        console.error("Pi Auth Error:", err);
        statusEl.textContent = "Ready. Click below inside Pi Browser to sign in.";
      }
    }

    document.getElementById("signin-btn").addEventListener("click", authenticateWithPi);
    window.addEventListener("DOMContentLoaded", authenticateWithPi);
  </script>
</body>
</html>
