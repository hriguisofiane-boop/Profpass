<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProofPass</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      background: #090614;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #130d26;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    h1 { color: #d4af37; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .status {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #d4af37, #8b5cf6);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PROOFPASS</h1>
    <p>Your Identity. Your Proofs. Your Power.</p>
    <div class="status" id="status">Connecting to Pi Network...</div>
    <button id="login-btn" type="button">Sign In with Pi</button>
  </div>

  <script>
    let sessionToken = null;
    let currentUser = null;

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment:", payment);
    }

    async function signInWithPi() {
      const statusEl = document.getElementById("status");
      try {
        await window.Pi.init({ version: "2.0" });
        const auth = await window.Pi.authenticate(["username"], onIncompletePaymentFound);

        const res = await fetch("https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken: auth.accessToken })
        });

        if (!res.ok) throw new Error("Login failed");
        const data = await res.json();

        sessionToken = data.sessionToken;
        currentUser = data.user;
        statusEl.textContent = "Verified as @" + currentUser.username;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Please open inside Pi Browser to authenticate.";
      }
    }

    document.getElementById("login-btn").addEventListener("click", signInWithPi);
    window.addEventListener("DOMContentLoaded", signInWithPi);
  </script>
</body>
</html>
