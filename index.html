DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofPass - Decentralized Identity</title>
    <!-- Pi Network Domain Validation -->
    <meta name="pi-app-validation" content="e65fcc7d8d0dc1e68bc73319ef912e66b78">
    
    <!-- Pi SDK Script -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f4f4f9, #e2d9f3); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 20px rgba(98, 37, 157, 0.15); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #62259d; margin-bottom: 5px; font-size: 26px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        #connect-btn { background-color: #62259d; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 12px; cursor: pointer; width: 100%; transition: background 0.3s; font-weight: bold; box-shadow: 0 4px 10px rgba(98, 37, 157, 0.3); }
        #connect-btn:hover { background-color: #4e1c7c; }
        
        /* تصميم بطاقة الهوية من الداخل */
        .id-badge { display: none; background: linear-gradient(135deg, #62259d, #8a4cb8); color: white; padding: 20px; border-radius: 15px; margin-top: 15px; text-align: right; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .id-badge h3 { margin: 0 0 10px 0; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; }
        .id-badge p { margin: 6px 0; font-size: 15px; }
        .verified-tag { background: #4CAF50; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ProofPass</h1>
        <div class="subtitle">Decentralized Identity & Verified Skills</div>
        
        <!-- زر تسجيل الدخول -->
        <button id="connect-btn">Connect with Pi Network</button>

        <!-- بطاقة الهوية التي تظهر من الداخل بعد تسجيل الدخول -->
        <div id="profile-card" class="id-badge">
            <h3>بطاقة الهوية الرقمية</h3>
            <p><strong>المستخدم:</strong> <span id="username-display"></span></p>
            <p><strong>الحالة:</strong> موثق عبر شبكة Pi</p>
            <span class="verified-tag">✓ Verified User</span>
        </div>
    </div>

    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0" });

        document.getElementById("connect-btn").addEventListener("click", async () => {
            try {
                const scopes = ['username', 'payments'];
                function onIncompletePaymentFound(payment) {}
                
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                // إخفاء زر الاتصال وإظهار تفاصيل الهوية من الداخل
                document.getElementById("connect-btn").style.display = "none";
                document.getElementById("username-display").innerText = auth.user.username;
                document.getElementById("profile-card").style.display = "block";
                
            } catch (error) {
                console.error("خطأ في المصادقة:", error);
                alert("فشل تسجيل الدخول، حاول مرة أخرى.");
            }
        });
